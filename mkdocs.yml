# Documentation configuration for cra-cli.
#
# Everything shared — theme, palette, markdown extensions, plugins,
# validation — is inherited from the template repository. This file carries
# only what makes this site *this* project.
#
# Never declare `plugins:` or `markdown_extensions:` here. MkDocs replaces
# lists rather than merging them, so doing so silently drops the entire
# shared configuration.
#
# PLACEHOLDERS to replace when stamping this into a repo:
INHERIT: .mkdocs-shared/shared/mkdocs.base.yml

site_name: CRA CLI
site_description: Track TFSA and FHSA contributions and calculate remaining contribution room from the terminal.
site_author: willtheorangeguy

# Must be exact. Material derives canonical links, the sitemap, and instant
# navigation from it; a wrong value breaks search indexing silently.
site_url: https://williamvdg.me/cra-cli/

repo_url: https://github.com/willtheorangeguy/cra-cli
repo_name: willtheorangeguy/cra-cli
edit_uri: edit/main/docs/

copyright: Copyright &copy; willtheorangeguy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - API: api.md
  - Contribution rules: contribution-rules.md
  - Usage: usage.md
  - Troubleshooting: troubleshooting.md

  # Extended pages. Drop any entry the repo does not warrant:
  #   testing.md  — only when there is a test suite
  #   ci-cd.md    — only when there are workflows
  #   faq.md      — only when there are recurring questions
  - Development:
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - FAQ: faq.md
      - Roadmap: roadmap.md
      - Development: development.md
      - Known issues: internal/known-issues.md
      - CI/CD: ci-cd.md
      - Testing: testing.md

  - About:
      - License: license.md
      - Contributing: https://github.com/willtheorangeguy/.github/blob/main/CONTRIBUTING.md
      - Code of Conduct: https://github.com/willtheorangeguy/.github/blob/main/CODE_OF_CONDUCT.md
      - Security: https://github.com/willtheorangeguy/.github/blob/main/SECURITY.md

# The writing standard is shipped with the docs but is not a site page.
exclude_docs: |
  docs.instructions.md
