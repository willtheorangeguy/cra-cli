name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify release tag
        run: |
          node -e 'const pkg = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + pkg.version) { throw new Error("Release tag does not match package version"); }'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm with token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to npm with trusted publishing
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish --registry=https://registry.npmjs.org --access public

      - name: Use GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
